<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="O Caminho - Sistema de estudo da Bíblia Sagrada">
  <meta name="author" content="Cleilton Nascimento">
  <meta name="theme-color" content="#1f3a5f">
  <title>O Caminho - Estudo da Bíblia</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('oc_tema');
        if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('oc_contraste') === 'alto') document.documentElement.setAttribute('data-contrast', 'alto');
        var f = localStorage.getItem('oc_fonte');
        if (f) document.documentElement.style.setProperty('--reader-size', f + 'rem');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo principal</a>

  <div class="app">
    <header class="topbar">
      <a class="logo" href="app.html" aria-label="O Caminho - página inicial">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a441"/><stop offset="1" stop-color="#b8862b"/></linearGradient></defs>
          <circle cx="48" cy="48" r="45" fill="none" stroke="url(#g2)" stroke-width="5"/>
          <path d="M14 62 L48 70 L82 62 L82 34 L48 42 L14 34 Z" fill="var(--card)" stroke="var(--primary)" stroke-width="4" stroke-linejoin="round"/>
          <path d="M48 66 C 44 56, 54 52, 48 44 C 46 41, 48 36, 48 30" fill="none" stroke="url(#g2)" stroke-width="5" stroke-linecap="round"/>
          <circle cx="48" cy="21" r="6" fill="url(#g2)"/>
        </svg>
        <span>O Caminho</span>
      </a>
      <span class="spacer"></span>
      <span class="who" id="quem"></span>
      <button type="button" class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Tema escuro">
        <span class="tt-track"><span class="tt-orb"><span class="tt-face tt-sun"></span><span class="tt-face tt-moon"></span></span></span>
      </button>
      <button type="button" class="btn sec small" data-act="sair">Sair</button>
    </header>

    <div class="shell">
      <nav class="nav" id="nav" aria-label="Menu principal"></nav>
      <main id="conteudo" tabindex="-1" aria-live="polite">
        <div class="loading"><div class="spinner"></div>Carregando...</div>
      </main>
    </div>

    <footer class="footer">
      © <span id="ano"></span> O Caminho · Sistema criado e desenvolvido por <strong>Cleilton Nascimento</strong> · Todos os direitos reservados.
    </footer>
  </div>

  <div id="modal-raiz"></div>
  <div id="aviso" class="sr-only" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
